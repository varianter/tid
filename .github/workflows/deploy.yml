name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment to deploy'
        required: true
        default: dev
        type: choice
        options:
          - lab
          - dev
          - prod
jobs:
  verify:
    uses: ./.github/workflows/verify.yml
    permissions:
      contents: read

  deploy:
    name: Deploy
    needs: verify
    # Prod only runs code that has been reviewed into main.
    if: inputs.environment != 'prod' || github.ref == 'refs/heads/main'
    uses: varianter/shared-workflows/.github/workflows/build-and-deploy-shared.yaml@main
    secrets: inherit
    with:
      environment: ${{ inputs.environment || 'dev' }}
      acr-url: variantplatformacr.azurecr.io
      image-name: tid
      docker-context: .
      dockerfile: ./apps/web/Dockerfile
      build-args: ''
      gitops-repository: infrastructure-as-code
      gitops-directory-path: deployments/${{ inputs.environment || 'dev' }}/workloads/tid
      gitops-workload-name: tid
      gitops-file-to-update: values.yaml
      gitops-yq-path: .image.tag
      gitops-continue-on-error: 'true'
      enable-gitops: 'true'

  rollout:
    name: Check rollout
    needs: deploy
    # Nothing to wait for when GitOps pushed no commit (disabled, nothing changed, or the push failed).
    if: needs.deploy.outputs.gitops-commit-sha != ''
    permissions:
      id-token: write # lets the shared workflow swap this job's OIDC token for read-only Argo CD access, no secrets
    uses: varianter/shared-workflows/.github/workflows/check-argocd-shared.yaml@main
    with:
      app: tid-${{ inputs.environment || 'dev' }}
      expected-revision: ${{ needs.deploy.outputs.gitops-commit-sha }}

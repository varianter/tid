name: Verify
run-name: "Verify — ${{ github.ref_name }} by @${{ github.actor }}"

on:
  workflow_call:
  pull_request:
    branches: [main]

permissions:
  contents: read

# Literal prefix: under workflow_call, github.workflow is the caller's name and would collide with its group.
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  biome:
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - uses: actions/checkout@v6

      - name: Setup Biome
        uses: biomejs/setup-biome@v2

      - name: Run Biome
        run: biome ci .

  typescript:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: ".bun-version"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: |
          echo "::add-matcher::.github/tsc-matcher.json"
          bunx tsc --noEmit

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5


    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: ".bun-version"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test
        run: bun test

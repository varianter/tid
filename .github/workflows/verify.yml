name: Verify
run-name: "Verify — ${{ github.ref_name }} by @${{ github.actor }}"

on:
  workflow_call:
  pull_request:
    branches: [main]

permissions:
  contents: read

# Literal prefix: under workflow_call, github.workflow is the caller's name and would collide with its group.
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  biome:
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - uses: actions/checkout@v7

      - name: Setup Biome
        uses: biomejs/setup-biome@4c91541eaada48f67d7dbd7833600ce162b68f51 # v2.7.1

      - name: Run Biome
        run: biome ci .

  typescript:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: ".bun-version"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: |
          echo "::add-matcher::.github/tsc-matcher.json"
          bun run typecheck

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5


    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: ".bun-version"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test
        run: bun run test

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: ".bun-version"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: E2E
        run: bun run e2e

  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - name: Build image
        run: docker build -f apps/web/Dockerfile -t tid-web .

      - name: Smoke test
        run: |
          docker run -d --name tid-web-smoke -p 3000:3000 -e DATABASE_URL=postgres://smoketest@localhost/smoketest -e ENTRA_TENANT_ID=smoketest tid-web
          curl -fsS --retry 10 --retry-all-errors --retry-delay 1 localhost:3000/health

      - name: Smoke test logs
        if: failure()
        run: docker logs tid-web-smoke

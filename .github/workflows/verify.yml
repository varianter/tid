name: Verify
run-name: "Verify — ${{ github.ref_name }} by @${{ github.actor }}"

on:
  workflow_call:
  pull_request:
    branches: [main]

permissions:
  contents: read

# Literal prefix: under workflow_call, github.workflow is the caller's name and would collide with its group.
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  biome:
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - uses: actions/checkout@v6

      - name: Setup Biome
        uses: biomejs/setup-biome@v2

      - name: Run Biome
        run: biome ci .

  typescript:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: ".bun-version"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: |
          echo "::add-matcher::.github/tsc-matcher.json"
          bunx tsc --noEmit

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    # Matches the address in .env.test.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: tid_test
        ports: ["5433:5432"]
        # Over TCP, because the temporary server that runs during first-time setup only listens on a socket.
        options: --health-cmd "pg_isready -h 127.0.0.1 -U postgres -d tid_test" --health-interval 2s --health-retries 15

    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: ".bun-version"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test
        run: bun test

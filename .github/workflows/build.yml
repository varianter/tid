name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: docker build -f apps/web/Dockerfile -t tid-web .
      - name: Smoke test
        run: |
          docker run -d -p 3000:3000 tid-web
          sleep 2
          curl -fsS localhost:3000

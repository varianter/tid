name: build

# PRs only; on main, deploy.yml builds the image and smoke-tests the real deployment.
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - run: docker build -f apps/web/Dockerfile -t tid-web .
      - name: Smoke test
        run: |
          docker run -d --name tid-web-smoke -p 3000:3000 -e DATABASE_URL=postgres://smoketest@localhost/smoketest tid-web
          curl -fsS --retry 10 --retry-all-errors --retry-delay 1 localhost:3000/health
      - name: Smoke test logs
        if: failure()
        run: docker logs tid-web-smoke

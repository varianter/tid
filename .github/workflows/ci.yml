name: CI
run-name: "CI — ${{ github.ref_name }} by @${{ github.actor }}"

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

# Literal prefix: under workflow_call, github.workflow is the caller's name and would collide with its group.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  biome:
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - uses: actions/checkout@v6

      - name: Setup Biome
        uses: biomejs/setup-biome@v2

      - name: Run Biome
        run: biome ci .

  typescript:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: ".bun-version"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: |
          echo "::add-matcher::.github/tsc-matcher.json"
          bunx tsc --noEmit

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: ".bun-version"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test
        run: bun test

  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v6

      - name: Build image
        run: docker build -f apps/web/Dockerfile -t tid-web .

      - name: Smoke test
        run: |
          docker run -d --name tid-web-smoke -p 3000:3000 -e DATABASE_URL=postgres://smoketest@localhost/smoketest -e ENTRA_TENANT_ID=smoketest tid-web
          curl -fsS --retry 10 --retry-all-errors --retry-delay 1 localhost:3000/health

      - name: Smoke test logs
        if: failure()
        run: docker logs tid-web-smoke
